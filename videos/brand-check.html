<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<style>
  body { width: 1920px; height: 1080px; position: relative; }

  #header { position: absolute; left: 140px; top: 90px; }
  #eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 24px; letter-spacing: 8px;
             text-transform: uppercase; color: var(--accent); }
  #title { font-family: var(--font-headline); font-weight: 700; font-size: 88px; line-height: 1.1;
           margin-top: 10px; letter-spacing: -1px; }

  #swatches { position: absolute; left: 140px; top: 330px; display: flex; gap: 40px; }
  .swatch { width: 200px; }
  .chip { width: 200px; height: 200px; border-radius: 28px;
          box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--muted) 35%, transparent),
                      0 18px 40px -18px color-mix(in srgb, var(--text) 35%, transparent); }
  .name { font-family: var(--font-headline); font-weight: 600; font-size: 26px; margin-top: 22px; }
  .hex  { font-family: var(--font-body); font-weight: 500; font-size: 21px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }

  #divider { position: absolute; left: 140px; top: 718px; height: 3px; background: var(--gold); border-radius: 2px; }

  .type { position: absolute; top: 760px; }
  #type-head { left: 140px; }
  #type-body { left: 1000px; width: 780px; }
  .label { font-family: var(--font-body); font-weight: 600; font-size: 20px; letter-spacing: 5px;
           text-transform: uppercase; color: var(--muted); }
  #head-sample { font-family: var(--font-headline); font-weight: 700; font-size: 104px; line-height: 1.15; margin-top: 8px; }
  #head-weights { font-family: var(--font-headline); font-size: 30px; margin-top: 4px; color: var(--accent); }
  #body-sample { font-family: var(--font-body); font-weight: 400; font-size: 31px; line-height: 1.5; margin-top: 18px; }
  #body-weights { font-family: var(--font-body); font-size: 24px; margin-top: 12px; color: var(--accent); }
</style>
</head>
<body>
  <div id="header">
    <div id="eyebrow">Brand check</div>
    <div id="title">Colors &amp; Type</div>
  </div>

  <div id="swatches"></div>
  <div id="divider"></div>

  <div class="type" id="type-head">
    <div class="label">Headline · Poppins</div>
    <div id="head-sample">Aa Bb Cc 123</div>
    <div id="head-weights"><span style="font-weight:400">Regular</span> &nbsp; <span style="font-weight:600">SemiBold</span> &nbsp; <span style="font-weight:800">ExtraBold</span></div>
  </div>
  <div class="type" id="type-body">
    <div class="label">Body · Montserrat</div>
    <div id="body-sample">The quick brown fox jumps over the lazy dog. Clear, friendly and easy to read at any size.</div>
    <div id="body-weights"><span style="font-weight:300">Light</span> &nbsp; <span style="font-weight:500">Medium</span> &nbsp; <span style="font-weight:700">Bold</span> &nbsp; <em>Italic</em></div>
  </div>

<script>
  window.DURATION = 5;
  window.SIZE = [1920, 1080];

  const colors = [
    ['Background', '--bg'], ['Accent', '--accent'], ['Text', '--text'], ['Muted', '--muted'],
    ['Gold', '--gold'], ['Pink', '--pink'], ['Cream', '--cream'],
  ];
  const css = getComputedStyle(document.documentElement);
  const row = document.getElementById('swatches');
  const swatches = colors.map(([name, v]) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.innerHTML = `<div class="chip" style="background:var(${v})"></div>
                    <div class="name">${name}</div>
                    <div class="hex">${css.getPropertyValue(v).trim().toUpperCase()}</div>`;
    row.appendChild(el);
    return { chip: el.querySelector('.chip'), labels: [el.querySelector('.name'), el.querySelector('.hex')] };
  });

  // helpers
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, start, dur) => clamp((t - start) / dur);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const outBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
  const rise = (el, p, dist = 30) => {           // fade + slide up
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * dist}px)`;
  };

  const $ = (id) => document.getElementById(id);

  window.render = (t) => {
    rise($('eyebrow'), outCubic(prog(t, 0.0, 0.6)));
    rise($('title'),   outCubic(prog(t, 0.1, 0.7)), 40);

    swatches.forEach((s, i) => {
      const start = 0.5 + i * 0.12;
      const p = prog(t, start, 0.55);
      s.chip.style.opacity = clamp(p * 3);
      s.chip.style.transform = `scale(${0.4 + 0.6 * outBack(p)})`;
      s.labels.forEach((l, j) => rise(l, outCubic(prog(t, start + 0.2 + j * 0.06, 0.5)), 16));
    });

    $('divider').style.width = 1640 * outCubic(prog(t, 1.7, 0.8)) + 'px';

    rise($('type-head'), outCubic(prog(t, 2.0, 0.7)), 40);
    rise($('type-body'), outCubic(prog(t, 2.2, 0.7)), 40);
  };

  window.render(0);
</script>
</body>
</html>
