<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d12; }
  #stage { position: relative; width: 1920px; height: 1080px; font-family: 'Inter Display', Inter, sans-serif; color: #f4f1ea; }
  .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 3px solid; transform: translate(-50%, -50%); }
  #title { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 168px; font-weight: 800; letter-spacing: -6px; }
  #sub { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 34px; letter-spacing: 10px; color: #ff8a5b; text-transform: uppercase; }
  #bar { position: absolute; left: 50%; top: 625px; height: 4px; background: #ff8a5b; transform: translateX(-50%); }
  .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #6ad1ff; }
</style>
</head>
<body>
<div id="stage">
  <div id="rings"></div>
  <div id="dots"></div>
  <div id="title">Motion Studio</div>
  <div id="bar"></div>
  <div id="sub">motion graphics as code</div>
</div>
<script src="../lib/motion.js"></script>
<script>
  const { ease, prog, tween, keyframes, spring, rng, splitChars, scene, lerp } = M;

  const colors = ['#ff8a5b', '#6ad1ff', '#c7a6ff'];
  const rings = [0, 1, 2].map((i) => {
    const el = document.createElement('div');
    el.className = 'ring';
    el.style.borderColor = colors[i];
    document.getElementById('rings').appendChild(el);
    return el;
  });

  const rand = rng(7);
  const dots = Array.from({ length: 60 }, () => {
    const el = document.createElement('div');
    el.className = 'dot';
    document.getElementById('dots').appendChild(el);
    return { el, a: rand() * Math.PI * 2, r: 300 + rand() * 700, s: 0.2 + rand() * 0.6, d: rand() * 1.2 };
  });

  const chars = splitChars(document.getElementById('title'));
  const sub = document.getElementById('sub');
  const bar = document.getElementById('bar');

  scene({ duration: 6, fps: 30 }, (t) => {
    const out = prog(t, 5.2, 0.8, ease.inCubic);       // global exit 0..1

    rings.forEach((el, i) => {
      const p = prog(t, 0.1 + i * 0.15, 1.6, ease.outExpo);
      const size = lerp(0, 700 + i * 220, p) + out * 900;
      el.style.width = el.style.height = size + 'px';
      el.style.opacity = (1 - p * 0.75) * (1 - out);
    });

    dots.forEach((d) => {
      const p = prog(t, d.d, 2.5, ease.outCubic);
      const ang = d.a + t * d.s * 0.4;
      const r = d.r * p;
      d.el.style.transform = `translate(${960 + Math.cos(ang) * r}px, ${540 + Math.sin(ang) * r}px)`;
      d.el.style.opacity = p * 0.7 * (1 - out);
    });

    chars.forEach((c, i) => {
      const s = spring(t, 0.6 + i * 0.045, { stiffness: 180, damping: 14 });
      c.style.transform = `translateY(${(1 - s) * 140 - out * 80}px) scale(${0.6 + 0.4 * s})`;
      c.style.opacity = Math.min(1, s) * (1 - out);
    });

    bar.style.width = keyframes(t, [[1.4, 0], [2.2, 520, ease.outQuart], [5.2, 520], [5.8, 0, ease.inQuart]]) + 'px';

    const sp = prog(t, 1.9, 0.9, ease.outCubic);
    sub.style.opacity = sp * (1 - out);
    sub.style.letterSpacing = tween(t, 1.9, 1.2, 30, 10, ease.outCubic) + 'px';
  });
</script>
</body>
</html>
